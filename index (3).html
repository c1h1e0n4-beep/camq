<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>神話闖關・神話挑戰</title>
<style>
:root{--ink:#211d20;--muted:#8d8179;--paper:#f8f0df;--paper2:#eadcc3;--verm:#a83b32;--verm-dark:#742720;--gold:#c5a15d;--jade:#557b6a;--night:#171d27;--line:rgba(86,65,51,.22)}
*{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;color:var(--ink);font-family:"Noto Serif TC","PingFang TC","Microsoft JhengHei",serif;background:linear-gradient(135deg,#26313a,#111722 58%,#30271f);overflow-x:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.28;background-image:radial-gradient(circle at 20% 20%,#fff 0 1px,transparent 1.5px),radial-gradient(circle at 75% 45%,#e8c57a 0 1px,transparent 1.5px);background-size:180px 180px,240px 240px}
.app{width:min(1120px,calc(100% - 30px));margin:0 auto;padding:32px 0 52px}.topbar{display:flex;justify-content:space-between;align-items:center;color:#f6e6c3;margin-bottom:28px}.brand{letter-spacing:4px;font-size:1.05rem}.seal{border:1px solid var(--gold);color:#f2d28e;padding:7px 10px;writing-mode:vertical-rl;letter-spacing:2px;font-size:.78rem}.hero{text-align:center;color:#f8e8c3;margin:16px 0 32px}.hero h1{font-size:clamp(2.2rem,6vw,4.3rem);letter-spacing:12px;text-shadow:0 4px 18px #000;margin-left:12px}.hero p{color:#cbbda4;letter-spacing:4px;margin-top:12px;font-size:.95rem}.steps{display:flex;justify-content:center;align-items:center;gap:0;margin:0 auto 26px;max-width:760px}.step{display:flex;align-items:center;color:#a99c8a;font-size:.85rem;letter-spacing:1px}.step i{width:32px;height:32px;border:1px solid #756a5b;border-radius:50%;display:grid;place-items:center;font-style:normal;margin-right:8px}.step.active{color:#f1d184}.step.active i{background:var(--verm);border-color:#e8b36e;color:#fff}.step.done i{background:var(--jade);border-color:#9bc3a8;color:#fff}.step:not(:last-child):after{content:"";width:58px;height:1px;background:#625b51;margin:0 15px}
.screen{display:none}.screen.active{display:block;animation:rise .4s ease}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}.panel{background:linear-gradient(145deg,rgba(250,243,228,.98),rgba(232,216,190,.96));border:1px solid #c3a976;box-shadow:0 20px 60px rgba(0,0,0,.28),inset 0 0 0 7px rgba(255,255,255,.22);padding:30px;border-radius:4px;position:relative}.panel:before,.panel:after{content:"";position:absolute;width:28px;height:28px;border-color:var(--verm);border-style:solid}.panel:before{left:13px;top:13px;border-width:1px 0 0 1px}.panel:after{right:13px;bottom:13px;border-width:0 1px 1px 0}.panel-title{text-align:center;color:var(--verm-dark);font-size:1.55rem;letter-spacing:5px;margin-bottom:24px}.panel-sub{text-align:center;color:#756657;margin:-12px 0 24px;font-size:.9rem}.setup-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.field{background:rgba(255,252,243,.65);border:1px solid var(--line);padding:18px}.field label{display:block;color:#6d4e3b;font-size:.86rem;letter-spacing:2px;margin-bottom:10px}.field input{width:100%;font:inherit;font-size:1.25rem;color:var(--verm-dark);background:transparent;border:0;border-bottom:1px solid #a88f6c;padding:7px 2px;outline:none}.hint{font-size:.76rem;color:#8a7765;margin-top:8px}.roster{grid-column:1/-1}.roster h3{font-size:.95rem;color:#6d4e3b;letter-spacing:2px;margin-bottom:12px}.student-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:9px}.student{padding:14px 5px;text-align:center;border:1px solid #b8a07c;background:#f5ead5;cursor:pointer;transition:.2s}.student:hover{transform:translateY(-2px);border-color:var(--verm)}.student.selected{background:var(--verm);color:#fff;border-color:#6e211b}.student.absent{opacity:.4;text-decoration:line-through;cursor:not-allowed}.student strong{display:block;letter-spacing:2px}.student small{font-size:.7rem;display:block;margin-top:5px;color:#766758}.student.selected small{color:#f6dbb9}.attend-toggle{border:0;background:none;color:inherit;font:inherit;font-size:.68rem;margin-top:8px;text-decoration:underline;cursor:pointer}.footer-actions{display:flex;justify-content:center;gap:12px;margin-top:26px}.btn{border:1px solid #72251e;background:linear-gradient(135deg,#b94c3d,#862b24);color:#fff;padding:12px 25px;letter-spacing:2px;font:inherit;cursor:pointer;box-shadow:0 5px 12px #5b302444}.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}.btn.secondary{background:transparent;color:var(--verm-dark);border-color:#a98a61}.btn.jade{background:linear-gradient(135deg,#668e78,#3c6253);border-color:#355344}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.trial-head{display:flex;justify-content:space-between;align-items:center;color:#ecdcae;margin-bottom:15px}.trial-head h2{font-size:1.4rem;letter-spacing:4px;font-weight:500}.progress-wrap{height:6px;background:#4b4e4d;border-radius:5px;margin-bottom:18px;overflow:hidden}.progress{height:100%;width:0;background:linear-gradient(90deg,#b34034,#d8ae63);transition:.3s}.trial-layout{display:grid;grid-template-columns:190px 1fr;gap:18px}.mountain-card{min-height:370px;display:flex;flex-direction:column;justify-content:flex-end;text-align:center;padding:18px 10px;color:#f4deb0;background:linear-gradient(165deg,#344a4b,#172a30 65%,#111923);border:1px solid #9a8054;position:relative;overflow:hidden}.mountain-card:before{content:"◈";position:absolute;top:38px;left:50%;transform:translateX(-50%);font-size:6rem;color:#c7a75f33}.mountain-card .glyph{font-size:4.5rem;color:#c8a363;line-height:1}.mountain-card h3{letter-spacing:4px;margin:12px 0 7px}.mountain-card p{font-size:.76rem;color:#bcaf99;line-height:1.7}.quiz-card{background:var(--paper);border:1px solid #b99b6c;min-height:370px;padding:27px;position:relative}.quiz-meta{display:flex;justify-content:space-between;border-bottom:1px dashed #ad9572;padding-bottom:12px;color:#765a43;font-size:.85rem}.timer{color:#fff;background:var(--verm-dark);padding:6px 11px;border-radius:2px;letter-spacing:1px}.timer.urgent{background:#d06135;animation:pulse .5s infinite alternate}@keyframes pulse{to{transform:scale(1.07)}}.question{font-size:1.27rem;line-height:1.7;font-weight:bold;margin:24px 0 20px}.options{display:grid;gap:10px}.option{background:#fffaf0;border:1px solid #c7ad86;padding:13px;text-align:left;font:inherit;cursor:pointer;color:#33261f;transition:.2s}.option:hover:not(:disabled){border-color:var(--verm);background:#f5e7ce;transform:translateX(4px)}.option.correct{background:#dcebdd;border-color:#548c60;color:#275a31}.option.wrong{background:#f4d9d2;border-color:#b84d42;color:#7c2923}.feedback{margin-top:14px;padding:12px;background:#efe2c8;border-left:3px solid var(--gold);line-height:1.6;font-size:.9rem}.trial-actions{display:flex;justify-content:space-between;align-items:center;margin-top:18px}.trial-note{color:#bda989;font-size:.8rem}.result-screen{text-align:center}.result-screen .panel{padding:34px}.result-emblem{font-size:4.2rem;color:var(--gold);margin-bottom:8px}.result-title{color:var(--verm-dark);letter-spacing:7px;font-size:2rem}.result-sub{color:#7a6654;margin:10px 0 24px}.score-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;text-align:left;margin:20px 0}.score-card{background:#f8edda;border:1px solid #c8ae83;padding:15px}.score-card h3{color:#694838;font-size:1rem;margin-bottom:12px}.score-line{display:flex;justify-content:space-between;color:#776554;font-size:.88rem;border-top:1px solid #dfccb0;padding-top:8px;margin-top:8px}.score-line strong{color:var(--verm-dark);font-size:1.1rem}.final-stat{color:#735b48;margin-top:18px}.empty{color:#9b8a75;padding:16px;text-align:center}
@media(max-width:720px){.app{width:min(100% - 18px,1120px);padding-top:18px}.hero h1{letter-spacing:6px}.setup-grid,.trial-layout{grid-template-columns:1fr}.student-grid{grid-template-columns:repeat(3,1fr)}.mountain-card{min-height:155px}.mountain-card .glyph{font-size:2.3rem}.panel{padding:22px 16px}.step:not(:last-child):after{width:18px;margin:0 6px}.step{font-size:.72rem}.step i{width:26px;height:26px;margin-right:4px}.trial-actions{gap:8px}.trial-actions .btn{padding:10px 12px;font-size:.82rem}}
</style>
</head>
<body>
<main class="app">
<header class="topbar"><div class="brand">神話學習站 · 闖關記</div><div class="seal">神話挑戰</div></header>
<section class="hero"><h1>神話闖關</h1><p>古代神話選 · 閱讀小測驗</p></section>
<nav class="steps" aria-label="測驗進度"><div class="step active" id="step1"><i>一</i>測驗設定</div><div class="step" id="step2"><i>二</i>答題進行中</div><div class="step" id="step3"><i>三</i>測驗結果</div></nav>
<section class="screen active" id="setupScreen"><div class="panel"><h2 class="panel-title">測驗設定 · 設定內容</h2><p class="panel-sub">先設定城鎮名稱、參加同學和題目數，就可以開始測驗。</p><div class="setup-grid"><div class="field"><label for="cityInput">城鎮名稱</label><input id="cityInput" value="雲夢城" maxlength="16"><div class="hint">這個名稱會顯示在最後的測驗結果中。</div></div><div class="field"><label for="targetCountInput">試題數</label><input id="targetCountInput" type="number" value="12" min="1" max="20"><div class="hint" id="divisibleHint">目前有 6 位同學，建議設定 6、12 或 18 題。</div></div><div class="field roster"><h3>參加同學名單 · 點選同學即可加入或移除本次測驗</h3><div class="student-grid" id="studentGrid"></div></div></div><div class="footer-actions"><button class="btn" id="beginBtn">開始測驗</button></div></div></section>
<section class="screen" id="trialScreen"><div class="trial-head"><h2 id="trialTitle">雲夢城 · 神話答題</h2><span id="trialCounter">已行 0 / 12 關</span></div><div class="progress-wrap"><div class="progress" id="progressBar"></div></div><div class="trial-layout"><aside class="mountain-card"><div class="glyph">山</div><h3>神話挑戰</h3><p>每一題會輪流指定一位同學。<br>請看清楚上方名字再作答。</p></aside><article class="quiz-card"><div class="quiz-meta"><span id="candidateTag">作答同學：—</span><span class="timer" id="timerBadge">剩餘時間 <b id="timerCount">20</b></span></div><div class="question" id="qText">準備開始第一題。</div><div class="options" id="optionsGrid"></div><div class="feedback" id="feedback" style="display:none"></div><div class="trial-actions"><span class="trial-note">每題限時 30 秒</span><button class="btn" id="nextBtn" style="display:none">下一題</button></div></article></div><div class="footer-actions"><button class="btn secondary" id="endEarlyBtn">提前結束測驗</button></div></section>
<section class="screen result-screen" id="resultScreen"><div class="panel"><div class="result-emblem">✦</div><h2 class="result-title">測驗結果</h2><p class="result-sub" id="resultSub">測驗已結束，以下是這次的成績。</p><div class="score-grid" id="scoreGrid"></div><p class="final-stat" id="finalStat"></p><div class="footer-actions"><button class="btn jade" id="exportBtn">匯出測驗結果（Word）</button><button class="btn secondary" id="restartBtn">重新開始</button></div></div></section>
</main>
<script>
const studentsData=[{name:"德宥",present:true},{name:"瑾雯",present:true},{name:"愛慈",present:true},{name:"韋翔",present:true},{name:"恩予",present:true},{name:"丞祐",present:true}];
const questions = [
      {
        id: 1,
        title: "古代「神話」最早是靠什麼方式流傳下來的創作？",
        options: ["刻在石頭上的文字", "皇帝寫的正式史書", "人們口耳相傳的口頭故事", "畫在牆壁上的圖畫"],
        ans: 2,
        desc: "神話是遠古人民口頭創作的故事，並不是一開始就寫在書上的喔！"
      },
      {
        id: 2,
        title: "課文提到，古代神話能為後來的哪一種文學提供豐富的靈感與養分？",
        options: ["小說", "新詩", "演講稿", "日記"],
        ans: 0,
        desc: "神話豐富的故事性與想像力，成為後代許多小說創作的重要借鏡。"
      },
      {
        id: 3,
        title: "世界剛形成時像一顆大雞蛋一樣混亂，是誰在裡面沉睡了一萬八千年？",
        options: ["夸父", "祝融", "共工", "盤古"],
        ans: 3,
        desc: "傳說中盤古在像雞蛋般混沌的天地中沉睡孕育，之後才開天闢地。"
      },
      {
        id: 4,
        title: "創造人類的女神「女媧」，傳說中她的外表長什麼樣子？",
        options: ["人頭蛇身", "人頭鳥身", "老虎臉配鹿角", "龍頭魚身"],
        ans: 0,
        desc: "古代神話中的女媧是「人頭蛇身」的神奇女神形象。"
      },
      {
        id: 5,
        title: "女媧覺得一個個捏泥人太慢了，後來拿什麼沾泥巴揮灑在地上快速造人？",
        options: ["池塘邊的藤蔓", "柳樹的枝條", "路邊的竹竿", "麻繩"],
        ans: 0,
        desc: "女媧順手扯下池邊的藤蔓浸入泥水，向空中一抖，甩出的小泥球就變成了人！"
      },
      {
        id: 6,
        title: "盤古快死的時候，他吐出來的氣息變成了大自然中的什麼？",
        options: ["風和雲", "江河湖泊", "閃電雷聲", "雨水和露水"],
        ans: 0,
        desc: "盤古呼出的氣變成了風和雲，聲音則變成了雷聲。"
      },
      {
        id: 7,
        title: "水神共工和火神祝融打架輸了，氣得去撞哪座山，結果把撐天的柱子撞斷了？",
        options: ["阿里山", "不周山", "泰山", "玉山"],
        ans: 1,
        desc: "共工戰敗後怒撞「不周山」，害天柱斷裂、大地傾斜。"
      },
      {
        id: 8,
        title: "天空破了一個大洞，女媧用什麼東西把它補起來？",
        options: ["天上的白雲", "五色石", "天邊的彩虹", "池塘的黃泥土"],
        ans: 1,
        desc: "女媧挑選了許多五色石加以煉製，補好天空的破洞。"
      },
      {
        id: 9,
        title: "夸父追太陽口渴得受不了，一口氣喝光了哪兩條河流的水？",
        options: ["淡水河與濁水溪", "黃河與渭河", "長江與淮河", "珠江與黑龍江"],
        ans: 1,
        desc: "夸父喝乾了黃河和渭河的水，但口渴依然沒有解開。"
      },
      {
        id: 10,
        title: "夸父渴死在路上之後，他留下來的木手杖最後變成了什麼？",
        options: ["一座連綿的大山", "一大片樹林", "一條清澈的小溪", "一堆碎石頭"],
        ans: 1,
        desc: "夸父丟下的手杖化成了一大片茂密的桃樹林。"
      },
      {
        id: 11,
        title: "課文裡說，遠古人民是因為對什麼感到好奇和疑惑，才想像創造出「神話」？",
        options: ["自然萬物的變化", "恐龍為什麼絕種", "外星人存不存在", "古代各朝代的戰爭"],
        ans: 0,
        desc: "遠古人無法理解大自然的變化，所以運用豐富想像創造出神話來解釋。"
      },
      {
        id: 12,
        title: "盤古開天闢地時，天和地每天會發生什麼神奇的變化？",
        options: ["天每天長高一丈，地每天增厚一丈", "天越來越矮，地越來越薄", "天跟地都沒有任何變化", "天每天變亮，地每天變暗"],
        ans: 0,
        desc: "「天日高一丈，地日厚一丈」，盤古也每天長高一丈，經過一萬八千年才分開。"
      },
      {
        id: 13,
        title: "盤古臨死前，他的兩隻眼睛變成了天空中的什麼？",
        options: ["太陽和月亮", "北極星和流星", "白雲和烏雲", "彩虹和晚霞"],
        ans: 0,
        desc: "盤古的雙眼化成了天上的太陽與月亮。"
      },
      {
        id: 14,
        title: "女媧一開始在巡視大地時，覺得身邊太孤單，是用什麼材料捏出小泥人的？",
        options: ["池塘邊的泥土", "高山上的白玉", "河底的白細沙", "森林裡的落葉"],
        ans: 0,
        desc: "女媧在水池旁用泥土捏出一個個小土偶，放在地上就變成活蹦亂跳的真人。"
      },
      {
        id: 15,
        title: "盤古死後，他身體裡的「骨髓」和流出的「汗水」分別變成了什麼？",
        options: ["珍珠美玉和雨露", "金銀財寶和白雪", "高山黑土和晨霧", "巨大岩石和海水"],
        ans: 0,
        desc: "骨髓化成了珍珠美玉，汗水變成了滋潤大地的雨露。"
      },
      {
        id: 16,
        title: "是哪兩尊神明起衝突大打出手，才害得天柱斷掉、天地裂開？",
        options: ["水神共工與火神祝融", "盤古與女媧", "夸父與后羿", "雷公與電母"],
        ans: 0,
        desc: "水神共工和火神祝融大戰引發大災難，天傾西北、地陷東南。"
      },
      {
        id: 17,
        title: "女媧修補完天空後，砍了什麼動物的四隻腳來撐住天地的四個角落？",
        options: ["巨大海龜", "上古神龍", "巨型大象", "深海巨鯨"],
        ans: 0,
        desc: "女媧砍下一隻巨大海龜（巨鰲）的四隻腳，立在四方撐住天空。"
      },
      {
        id: 18,
        title: "課文最後提到，哪一個神話故事是在表現「人類堅強不屈的意志」？",
        options: ["夸父逐日", "女媧造人", "盤古開天", "祝融大戰共工"],
        ans: 0,
        desc: "夸父追趕太陽雖然犧牲，卻展現出遠古人類征服自然、追求理想的勇氣。"
      },
      {
        id: 19,
        title: "夸父喝完黃河跟渭河的水還是很渴，本來打算跑到北方喝哪裡的水，卻在半路渴死了？",
        options: ["大湖的水", "北海的水", "天池的水", "冰川的水"],
        ans: 0,
        desc: "夸父又往北跑想喝大湖（大澤）裡的水，但還沒跑到就渴死在半路上。"
      },
      {
        id: 20,
        title: "盤古死後，他身上寄生的小蟲被暖暖的微風一吹，最後變成了什麼？",
        options: ["大地上的老百姓", "天上的小鳥", "草地上的牛羊", "樹林間的昆蟲"],
        ans: 0,
        desc: "盤古身上的小蟲受到暖風吹拂，變成了大地上的眾多百姓。"
      }
    ];
let targetQuestionCount=12,cityName="雲夢城",selectedStudentName=null,activeStudents=[],usedQuestionIds=new Set(),currentQuestion=null,quizLogs=[],timerInterval=null,timeLeft=30,isAnswering=false;
const $=id=>document.getElementById(id); const letters=["A","B","C","D"];
function renderStudents(){const grid=$("studentGrid");grid.innerHTML="";const present=studentsData.filter(s=>s.present).length;updateHint(present);studentsData.forEach(st=>{const el=document.createElement("div");el.className=`student ${st.present?'':'absent'} ${selectedStudentName===st.name?'selected':''}`;el.innerHTML=`<strong>${st.name}</strong><small>${st.present?'準備中':'未參加'}</small><button class="attend-toggle">${st.present?'不參加本次測驗':'加入本次測驗'}</button>`;el.onclick=e=>{if(e.target.tagName==='BUTTON'){st.present=!st.present;if(!st.present&&selectedStudentName===st.name)selectedStudentName=null;renderStudents();return}if(st.present){selectedStudentName=st.name;renderStudents()}};grid.appendChild(el)})}
function updateHint(n){$("divisibleHint").textContent=n?`出席 ${n} 人，建議 ${Array.from({length:Math.floor(20/n)},(_,i)=>(i+1)*n).join('、')} 題。`:'目前沒有參加的同學。'}
function setScreen(name){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$(name).classList.add('active');document.querySelectorAll('.step').forEach(s=>s.classList.remove('active','done'));if(name==='setupScreen')$("step1").classList.add('active');if(name==='trialScreen'){$("step1").classList.add('done');$("step2").classList.add('active')}if(name==='resultScreen'){ $("step1").classList.add('done');$("step2").classList.add('done');$("step3").classList.add('active')}}
function beginTrial(){cityName=$("cityInput").value.trim()||'無名城';targetQuestionCount=Math.max(1,Math.min(20,parseInt($("targetCountInput").value)||12));if(!studentsData.some(s=>s.present)){alert('目前沒有參加的同學，請先加入至少一位同學。');return}usedQuestionIds.clear();quizLogs=[];activeStudents=studentsData.filter(s=>s.present);selectedStudentName=activeStudents[0].name;$("trialTitle").textContent=`${cityName} · 神話答題`;$("endEarlyBtn").disabled=false;setScreen('trialScreen');drawQuestion()}
function drawQuestion(){if(usedQuestionIds.size>=targetQuestionCount||usedQuestionIds.size>=questions.length){finishTrial();return}const pool=questions.filter(q=>!usedQuestionIds.has(q.id));currentQuestion=pool[Math.floor(Math.random()*pool.length)];selectedStudentName=activeStudents[usedQuestionIds.size%activeStudents.length].name;usedQuestionIds.add(currentQuestion.id);isAnswering=true;$("trialCounter").textContent=`已完成 ${usedQuestionIds.size-1} / ${targetQuestionCount} 題`;$("progressBar").style.width=`${((usedQuestionIds.size-1)/targetQuestionCount)*100}%`;$("candidateTag").textContent=`本題請 ${selectedStudentName} 作答`;$("qText").textContent=currentQuestion.title;$("feedback").style.display='none';$("nextBtn").style.display='none';const opts=$("optionsGrid");opts.innerHTML='';currentQuestion.options.forEach((o,i)=>{const b=document.createElement('button');b.className='option';b.innerHTML=`<b>${letters[i]}.</b> ${o}`;b.onclick=()=>judge(i,b);opts.appendChild(b)});startTimer()}
function startTimer(){clearInterval(timerInterval);timeLeft=30;$("timerCount").textContent=timeLeft;$("timerBadge").classList.remove('urgent');timerInterval=setInterval(()=>{timeLeft--;$("timerCount").textContent=timeLeft;if(timeLeft<=5)$("timerBadge").classList.add('urgent');if(timeLeft<=0){clearInterval(timerInterval);judge(null,null)}},1000)}
function judge(choice,button){if(!isAnswering)return;isAnswering=false;clearInterval(timerInterval);document.querySelectorAll('.option').forEach(b=>b.disabled=true);const correct=choice===currentQuestion.ans;if(button)button.classList.add(correct?'correct':'wrong');document.querySelectorAll('.option')[currentQuestion.ans].classList.add('correct');const fb=$("feedback");fb.style.display='block';fb.innerHTML=choice===null?`<b>剩餘時間已盡，再努力一下！</b> 正解為 ${letters[currentQuestion.ans]}。<br>${currentQuestion.desc}`:correct?`<b>答對了！</b> 答得很好，得分加一。<br>${currentQuestion.desc}`:`<b>這題答錯了。</b> 正解為 ${letters[currentQuestion.ans]}。<br>${currentQuestion.desc}`;quizLogs.push({studentName:selectedStudentName||'作答同學',qId:currentQuestion.id,qTitle:currentQuestion.title,chosenOpt:choice===null?'逾時未答':`(${letters[choice]}) ${currentQuestion.options[choice]}`,correctOpt:`(${letters[currentQuestion.ans]}) ${currentQuestion.options[currentQuestion.ans]}`,isCorrect:correct,desc:currentQuestion.desc});$("nextBtn").textContent=usedQuestionIds.size>=targetQuestionCount?'查看測驗結果':'下一題';$("nextBtn").style.display='block';$("trialCounter").textContent=`已完成 ${usedQuestionIds.size} / ${targetQuestionCount} 題`;$("progressBar").style.width=`${(usedQuestionIds.size/targetQuestionCount)*100}%`}
function finishTrial(){clearInterval(timerInterval);renderResults();setScreen('resultScreen')}
function renderResults(){const grid=$("scoreGrid");grid.innerHTML='';studentsData.forEach(st=>{const logs=quizLogs.filter(l=>l.studentName===st.name),correct=logs.filter(l=>l.isCorrect).length,rate=logs.length?Math.round(correct/logs.length*100):0;const card=document.createElement('div');card.className='score-card';card.innerHTML=`<h3>${st.name} ${st.present?'':'· 未參加'}</h3><div class="score-line"><span>作答題數</span><strong>${logs.length}</strong></div><div class="score-line"><span>答對題數</span><strong>${correct}</strong></div><div class="score-line"><span>答對率</span><strong>${logs.length?rate+'%':'—'}</strong></div>`;grid.appendChild(card)});$("resultSub").textContent=`${cityName} 的同學已完成這次神話答題。`;$("finalStat").textContent=`共完成 ${quizLogs.length} 題 · 答對 ${quizLogs.filter(l=>l.isCorrect).length} 題`}
function exportToWord(){if(!quizLogs.length){alert('目前沒有測驗紀錄可以匯出。');return}const now=new Date(),rows=studentsData.map(st=>{const logs=quizLogs.filter(l=>l.studentName===st.name),c=logs.filter(l=>l.isCorrect).length;return `<tr><td>${st.name}</td><td>${st.present?'參加':'未參加'}</td><td>${logs.length}</td><td>${c}</td><td>${logs.length?Math.round(c/logs.length*100)+'%':'—'}</td></tr>`}).join('');const details=quizLogs.map((l,i)=>`<tr><td>${i+1}</td><td>${l.studentName}</td><td>${l.qTitle}</td><td>${l.chosenOpt}</td><td>${l.correctOpt}</td><td>${l.isCorrect?'答對':'答錯'}</td></tr>`).join('');const html=`<html><head><meta charset='utf-8'><style>body{font-family:Microsoft JhengHei;padding:28px;color:#33261f}h1{color:#8a2d25;text-align:center}h2{color:#8a2d25;border-bottom:2px solid #c5a15d;padding-bottom:6px;margin-top:28px}table{width:100%;border-collapse:collapse;margin-top:10px}th,td{border:1px solid #b9a486;padding:8px}th{background:#eee0c7}</style></head><body><h1>《神話闖關》${cityName} · 同學測驗結果</h1><p>匯出時間：${now.toLocaleString('zh-TW')}　｜　測驗總題數：${quizLogs.length}</p><h2>一、每位同學的成績</h2><table><tr><th>同學</th><th>狀態</th><th>作答題數</th><th>答對題數</th><th>答對率</th></tr>${rows}</table><h2>二、每題作答紀錄</h2><table><tr><th>序</th><th>同學</th><th>試題</th><th>所答</th><th>正解</th><th>判語</th></tr>${details}</table></body></html>`;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff',html],{type:'application/msword;charset=utf-8'}));a.download=`${cityName}_同學測驗結果.doc`;a.click();URL.revokeObjectURL(a.href)}
$("beginBtn").onclick=beginTrial;$("nextBtn").onclick=drawQuestion;$("endEarlyBtn").onclick=finishTrial;$("exportBtn").onclick=exportToWord;$("restartBtn").onclick=()=>setScreen('setupScreen');$("targetCountInput").onchange=()=>{let v=parseInt($("targetCountInput").value)||12;$("targetCountInput").value=Math.max(1,Math.min(20,v));updateHint(studentsData.filter(s=>s.present).length)};renderStudents();
</script></body></html>
